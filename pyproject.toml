[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diagram-creator"
description = "Create polished workflow diagrams from small JSON specifications."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "pillow>=11.0",
]
authors = [
    {name = "Alexey Grigorev"},
]

[project.scripts]
diagram-creator = "diagram_creator.cli:main"

[dependency-groups]
dev = [
    "hatch",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["diagram_creator"]

[tool.hatch.build.targets.wheel.force-include]
"skills/diagram-creator/assets/icons.svg" = "diagram_creator/assets/icons.svg"

[tool.hatch.version]
path = "diagram_creator/__version__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
