<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Analytics maturity</title>
  <desc id="desc">Five analytics stages climb from raw collection up to automated decisions.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="1.75" vector-effect="non-scaling-stroke"/>
        <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="1.75" vector-effect="non-scaling-stroke"/>
      </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24">
        <path d="m12 2 1.4 4.6L18 8l-4.6 1.4L12 14l-1.4-4.6L6 8l4.6-1.4ZM19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8ZM5 14l.8 2.2L8 17l-2.2.8L5 20l-.8-2.2L2 17l2.2-.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .node rect { stroke-width: 2; }
      .node-title { font-size: 20px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 16px; font-weight: 500; fill: #7a8699; text-anchor: middle; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1px; fill: #64748b; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>

  <path class="edge" d="M320 548H413Q425 548 425 536V482" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M530 434H623Q635 434 635 422V368" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M740 320H833Q845 320 845 308V254" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M950 206H1043Q1055 206 1055 194V140" stroke="#64748b" marker-end="url(#arrow-gray)"/>

  <g class="node node-gray" transform="translate(40 500)" filter="url(#shadow)">
    <rect width="280" height="96" rx="18" fill="#f8fafc" stroke="#64748b"/>
    <use href="#icon-database" x="78.62" y="18" width="34" height="34" color="#64748b"/>
    <text class="node-title icon-copy" x="119.25" y="42.2" font-size="20">Collect</text>
    <text class="node-subtitle" x="140" y="73" font-size="16">Events land in the warehouse</text>
  </g>
  <g class="node node-blue" transform="translate(250 386)" filter="url(#shadow)">
    <rect width="280" height="96" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-document" x="78.81" y="18" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="117.74" y="42.2" font-size="20">Report</text>
    <text class="node-subtitle" x="140" y="73" font-size="16">What happened last week</text>
  </g>
  <g class="node node-purple" transform="translate(460 272)" filter="url(#shadow)">
    <rect width="280" height="96" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-search" x="75.22" y="18" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="117.55" y="42.2" font-size="20">Explain</text>
    <text class="node-subtitle" x="140" y="73" font-size="16">Why the numbers moved</text>
  </g>
  <g class="node node-amber" transform="translate(670 158)" filter="url(#shadow)">
    <rect width="280" height="96" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-sparkles" x="76.75" y="18" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="121.05" y="42.2" font-size="20">Predict</text>
    <text class="node-subtitle" x="140" y="73" font-size="16">What happens next</text>
  </g>
  <g class="node node-green" transform="translate(880 44)" filter="url(#shadow)">
    <rect width="280" height="96" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-settings" x="61.94" y="18" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="106.51" y="42.2" font-size="20">Automate</text>
    <text class="node-subtitle" x="140" y="73" font-size="16">The system decides and acts</text>
  </g>
</svg>
