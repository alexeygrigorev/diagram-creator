<svg xmlns="http://www.w3.org/2000/svg" width="930" height="860" viewBox="0 0 930 860" role="img" aria-labelledby="title desc">
  <title id="title">Continuous FAQ curation and improvement loop</title>
  <desc id="desc">Students contribute FAQ issues, useful Slack discussions become reviewed records, the dataset is indexed and deployed, Au-Tomator answers questions, and incomplete answers become evaluation cases that guide the next FAQ improvements.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
    <symbol id="icon-issue" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/>
      </symbol>
    <symbol id="icon-message" viewBox="0 0 24 24">
        <path d="M4 4h16v12H9l-5 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 9h8M8 13h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
        <path d="M12 3 2.5 21h19Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.1" fill="currentColor"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .node rect { stroke-width: 2; }
      .node-title { font-size: 20px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 16px; font-weight: 500; fill: #7a8699; text-anchor: middle; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1px; fill: #64748b; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>
  <rect width="930" height="860" fill="#ffffff"/>

  <path class="edge" d="M603.69 182.17A310.18 310.18 0 0 1 686.01 241.98" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M771.73 505.78A310.18 310.18 0 0 1 740.28 602.56" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M515.88 765.6A310.18 310.18 0 0 1 414.12 765.6" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M189.72 602.56A310.18 310.18 0 0 1 158.27 505.78" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M243.99 241.98A310.18 310.18 0 0 1 326.31 182.17" stroke="#64748b" marker-end="url(#arrow-gray)"/>

  <circle class="center-annotation" cx="465" cy="459.62" r="68"/>
  <text class="center-title" x="465" y="453.95" font-size="16">CURATION</text>
  <text class="center-title" x="465" y="475.95" font-size="16">LOOP</text>
  <text class="center-detail" x="465" y="547.62" font-size="12">Each failure improves the data</text>

  <g class="node node-blue" transform="translate(335 41.44)" filter="url(#shadow)">
    <rect width="260" height="216" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-issue" x="14.63" y="67" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="57.81" y="89.4" font-size="15">Student contributions</text>
    <text class="node-subtitle" x="130" y="122" font-size="16">Issues improve the FAQ</text>
    <text class="node-subtitle" x="130" y="144" font-size="16">dataset</text>
  </g>
  <g class="node node-purple" transform="translate(630 255.77)" filter="url(#shadow)">
    <rect width="260" height="216" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-message" x="27.71" y="67" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="69.46" y="89.4" font-size="15">Curate discussions</text>
    <text class="node-subtitle" x="130" y="122" font-size="16">Slack → reviewed FAQ</text>
    <text class="node-subtitle" x="130" y="144" font-size="16">records</text>
  </g>
  <g class="node node-green" transform="translate(517.32 602.56)" filter="url(#shadow)">
    <rect width="260" height="216" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-database" x="43.67" y="67" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="85.42" y="89.4" font-size="15">Index + deploy</text>
    <text class="node-subtitle" x="130" y="122" font-size="16">Fresh dataset ships with</text>
    <text class="node-subtitle" x="130" y="144" font-size="16">Lambda</text>
  </g>
  <g class="node node-purple" transform="translate(152.68 602.56)" filter="url(#shadow)">
    <rect width="260" height="216" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="mention-icon" x="48.88" y="92.4" fill="#7c3aed">@</text>
    <text class="node-title icon-copy" x="75.06" y="89.4" font-size="15">Answer questions</text>
    <text class="node-subtitle" x="130" y="122" font-size="16">Au-Tomator responds in</text>
    <text class="node-subtitle" x="130" y="144" font-size="16">Slack</text>
  </g>
  <g class="node node-red" transform="translate(40 255.77)" filter="url(#shadow)">
    <rect width="260" height="216" rx="18" fill="#fef2f2" stroke="#dc2626"/>
    <use href="#icon-warning" x="36.1" y="67" width="34" height="34" color="#dc2626"/>
    <text class="node-title icon-copy" x="79.82" y="89.4" font-size="15">Evaluate failures</text>
    <text class="node-subtitle" x="130" y="122" font-size="16">Missing answers reveal next</text>
    <text class="node-subtitle" x="130" y="144" font-size="16">fixes</text>
  </g>
</svg>
